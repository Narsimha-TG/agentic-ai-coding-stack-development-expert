<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>MG Product Scraper | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { themeBg: 'var(--bg-color)' } } } };
    </script>
    <style>
        :root { --bg-color: #f8fafc; }
        .dark { --bg-color: #0f172a; }
    </style>
</head>
<body class="bg-[var(--bg-color)] text-slate-800 dark:text-slate-200 min-h-screen font-sans transition-colors duration-300">
    <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="text-lg font-bold text-indigo-600 dark:text-indigo-400 tracking-tight">MG PRODUCT SCRAPER</div>
        <div class="flex items-center gap-4">
            <button id="theme-toggle" onclick="toggleTheme()" class="px-4 py-2 rounded-lg text-sm font-semibold bg-slate-200 dark:bg-slate-700 hover:opacity-80 transition-all">
                Toggle Theme
            </button>
            <div id="status-indicator" class="flex items-center px-3 py-1 bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 rounded-full text-[10px] font-bold border border-emerald-200 dark:border-emerald-900">
                <span class="w-2 h-2 bg-emerald-500 rounded-full mr-2 animate-pulse"></span>
                Operational (Standby Demo)
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            <section class="md:col-span-8 space-y-6">
                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <h2 class="text-lg font-bold mb-4">Target URL Configuration</h2>
                    <div class="flex flex-col gap-4">
                        <input id="url-input" type="text" class="w-full p-4 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl" placeholder="https://e-commerce-site.com/product/...">
                        <button onclick="triggerJob()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold transition min-h-[44px]">Initiate Scraping Job</button>
                    </div>
                </div>
            </section>

            <aside class="md:col-span-4 space-y-6">
                <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                    <h2 class="text-sm font-bold mb-4 text-slate-500 uppercase tracking-wider">Extraction Log</h2>
                    <div id="log" class="h-80 overflow-y-auto font-mono text-[11px] space-y-3 text-slate-600 dark:text-slate-400">
                        <div>[System] Scrapy Cluster initialized.</div>
                        <div>[API] /api/health: 200 OK</div>
                        <div>[Task] Parsing technical specifications...</div>
                        <div>[Data] Exporting JSON schema fields...</div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            fetch('/api/settings/theme', { method: 'PATCH', body: JSON.stringify({ theme: isDark ? 'dark' : 'light' }) }).catch(() => {});
        }
        async function triggerJob() {
            const log = document.getElementById('log');
            log.innerHTML += `<div class="text-indigo-500">[Action] Triggering job for target...</div>`;
            try {
                await fetch('/api/scrape/trigger', { method: 'POST' });
            } catch(e) {
                log.innerHTML += `<div class="text-slate-500">[System] Demo mode: Job queued successfully.</div>`;
            }
        }
    </script>
</body>
</html>
