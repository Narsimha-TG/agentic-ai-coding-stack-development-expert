<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Cloud Verification CMS | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased overflow-x-hidden">
    <nav class="bg-white border-b border-slate-200 px-4 py-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-xl font-extrabold tracking-tighter text-indigo-600">CLOUD.VERIFY</div>
            <div id="sync-status" class="flex items-center text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">
                <span class="w-2 h-2 bg-emerald-500 rounded-full mr-2 animate-pulse"></span>
                Operational (Standby Demo)
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            <section class="md:col-span-8 space-y-8">
                <div class="bg-white border border-slate-200 p-8 rounded-3xl shadow-sm">
                    <h2 class="text-2xl font-bold mb-6">Live Verification Feed</h2>
                    <div id="data-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="p-4 border border-slate-100 bg-slate-50 rounded-2xl">
                            <div class="text-xs font-bold text-slate-400 uppercase">ID: #8829</div>
                            <div class="font-bold text-lg">System Integrity Check</div>
                            <div class="text-sm text-emerald-600 font-medium">Status: Verified</div>
                            <button onclick="trackEvent('Action: Approve')" class="mt-4 w-full bg-indigo-600 text-white py-3 rounded-xl font-bold min-h-[44px] hover:bg-indigo-700 transition-all">Approve Action</button>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="md:col-span-4 space-y-8">
                <div class="bg-white p-6 border border-slate-200 rounded-3xl shadow-sm">
                    <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4">Agent Decision Log</h3>
                    <div id="log" class="h-64 overflow-y-auto font-mono text-[11px] space-y-3 text-slate-600">
                        <div>[System] Engine initialized.</div>
                        <div>[API] /api/health: 200 OK</div>
                        <div>[Analytics] Metrics stream connected.</div>
                        <div>[Security] Token validation successful.</div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        async function trackEvent(action) {
            const log = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'text-indigo-600';
            entry.textContent = `[Event] ${action} processed.`;
            log.prepend(entry);
            try {
                await fetch('/api/reviews', { method: 'POST', body: JSON.stringify({ action }) });
            } catch(e) {
                console.log('Demo Mode: Event logged locally.');
            }
        }
        
        window.onload = () => {
            console.log('Cloud Engine UI Ready');
        };
    </script>
</body>
</html>
